marketing:

  - id: aaker-brand-equity-1991
    titulo: Managing Brand Equity — Capitalizing on the Value of a Brand Name
    autores: ["Aaker, D. A."]
    año: 1991
    edicion_vigente: "1991 (vigente como referencia conceptual)"
    categoria: libro
    dominios: [marketing, branding]
