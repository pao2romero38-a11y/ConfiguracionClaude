    license: copyright
    status: vigente
    url_oficial: "https://www.cinif.org.mx/"
    idiomas: [es]
    confianza: alta
    notas: |
      Estándar contable mexicano obligatorio para empresas en México.
      CINIF publica el compendio anual y boletines de actualización
      durante el año. [⚠ verificar boletines posteriores a la edición vigente]

