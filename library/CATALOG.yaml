      editor_es: "IFRS Foundation publica traducciones autorizadas en español"
    confianza: alta
    notas: |
      Estándar contable internacional usado por la mayoría de empresas
      cotizadas globalmente (excepto US GAAP en EE.UU.). Para empresas
      mexicanas con operaciones internacionales, citar IFRS junto a NIF
      indicando reconciliación cuando aplique.

