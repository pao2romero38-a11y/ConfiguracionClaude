    idiomas: [en]
    confianza: alta
    notas: |
      Referencia universal de valuación. Damodaran mantiene un sitio
      con datos actualizados (https://pages.stern.nyu.edu/~adamodar/)
      que complementa el libro. Para casos prácticos con datos de
      mercado, consultar el sitio antes del libro.

  - id: ifrs-2024
    titulo: International Financial Reporting Standards (IFRS) — Standards and Conceptual Framework
    autores: ["International Accounting Standards Board (IASB)"]
    año: 2024
