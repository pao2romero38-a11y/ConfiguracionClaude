      editor_es: "CECSA (México) / Pirámide (España)"
    confianza: alta
    notas: |
      Origen de las 5 fuerzas competitivas. Referencia obligatoria
      para análisis sectorial. Citar junto con Porter (1985,
      "Competitive Advantage") cuando se trabaja la cadena de valor.

  - id: ries-trout-positioning-2001
    titulo: Positioning — The Battle for Your Mind
    autores: ["Ries, A.", "Trout, J."]
    año: 2001
    edicion_vigente: "20th Anniversary Edition (2001); original 1981"
