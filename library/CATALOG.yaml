    idiomas: [es]
    confianza: alta
    notas: |
      Marco conceptual que sustenta todas las NIF mexicanas. Define
      postulados básicos, características cualitativas de la información
      financiera, elementos de los estados financieros y bases para
      reconocimiento y valuación.

  - id: damodaran-investment-valuation-2012
