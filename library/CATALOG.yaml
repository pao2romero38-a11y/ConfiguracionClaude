    autores: ["National Institute of Standards and Technology"]
    año: 2020
    edicion_vigente: "Rev. 5 (septiembre 2020) con actualizaciones"
    categoria: norma
    dominios: [seguridad-cumplimiento]
    skills: [/seg, /ci, /aud]
    license: public_domain
    status: vigente
    url_oficial: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    idiomas: [en]
    confianza: alta
    notas: |
      Catálogo de 1000+ controles de seguridad y privacidad. Obligatorio
      para sistemas federales US y de contratistas. Frecuentemente usado
      como referencia detallada que complementa NIST CSF (más abstracto).

  - id: pci-dss-4-2022
    titulo: Payment Card Industry Data Security Standard (PCI DSS) v4.0
    autores: ["PCI Security Standards Council"]
    año: 2022
    edicion_vigente: "v4.0 (marzo 2022) — vigente; v3.2.1 retirado en marzo 2024"
    categoria: norma
    dominios: [seguridad-cumplimiento, datos-tarjetas]
    skills: [/seg, /ci, /aud]
    license: copyright
    status: vigente
    url_oficial: "https://www.pcisecuritystandards.org/document_library/"
    idiomas: [en]
    confianza: alta
    notas: |
