      Tecnológico). Período de transición 2022-2025; verificar status
      de certificaciones vigentes.

  - id: iso-27002-2022
    titulo: ISO/IEC 27002:2022 — Information security, cybersecurity and privacy protection — Information security controls
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2022
    edicion_vigente: "ISO/IEC 27002:2022"
