# ============================================================
# DOMINIO: ia-gobernanza
# ============================================================
ia-gobernanza:

  - id: eu-ai-act-2024
    titulo: Regulation (EU) 2024/1689 (Artificial Intelligence Act)
    autores: ["Parlamento Europeo y Consejo de la UE"]
    año: 2024
    edicion_vigente: "Reglamento UE 2024/1689 (en vigor desde 1 de agosto de 2024; aplicación escalonada)"
    categoria: regulacion
    dominios: [ia-gobernanza]
    skills: [/ai, /seg, /rsk, /ci]
    license: public_domain
    status: vigente
    url_oficial: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    idiomas: [en, es, varios EU]
    confianza: alta
    notas: |
      Primer marco regulatorio comprehensivo de IA con alcance
      extraterritorial. Clasifica sistemas por nivel de riesgo
      (prohibido, alto, limitado, mínimo). Aplicación escalonada:
      prohibiciones desde feb 2025, gobernanza de modelos generales
      desde ago 2025, alto riesgo desde ago 2026.

  - id: iso-23894-2023
    titulo: ISO/IEC 23894:2023 — Information technology — Artificial intelligence — Guidance on risk management
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2023
    edicion_vigente: "ISO/IEC 23894:2023"
    categoria: norma
    dominios: [ia-gobernanza, riesgos]
    skills: [/ai, /rsk]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/77304.html"
    idiomas: [en]
    confianza: alta
    notas: |
      Guía de gestión de riesgos específica para IA. Extiende ISO 31000
      con criterios IA: explicabilidad, sesgos, seguridad de modelos,
      privacidad en aprendizaje. Complementa ISO/IEC 42001.

  - id: iso-42001-2023
    titulo: ISO/IEC 42001:2023 — Information technology — Artificial intelligence — Management system
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2023
    edicion_vigente: "ISO/IEC 42001:2023"
    categoria: norma
    dominios: [ia-gobernanza]
    skills: [/ai, /seg, /ci]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/81230.html"
    idiomas: [en]
    confianza: alta
    notas: |
      Primera norma ISO certificable para sistemas de gestión de IA
      (AIMS). Análoga a ISO 27001 pero para gobernanza de IA. Aplica
      a organizaciones que desarrollan o usan sistemas de IA.

  - id: nist-ai-rmf-1-2023
    titulo: NIST AI Risk Management Framework (AI RMF 1.0)
    autores: ["National Institute of Standards and Technology"]
    año: 2023
    edicion_vigente: "AI RMF 1.0 (enero 2023)"
    categoria: norma
    dominios: [ia-gobernanza, riesgos]
    skills: [/ai, /rsk, /seg]
    license: public_domain
    status: vigente
    doi: "10.6028/NIST.AI.100-1"
    url_oficial: "https://www.nist.gov/itl/ai-risk-management-framework"
    idiomas: [en]
    confianza: alta
    notas: |
      Marco voluntario de gestión de riesgos de IA. 4 funciones core:
      Govern, Map, Measure, Manage. Generic AI Profile y otros perfiles
      sectoriales (GenAI Profile publicado julio 2024). Frecuentemente
      citado como referencia técnica.

  - id: oecd-ai-principles-2024
    titulo: OECD Principles on Artificial Intelligence
    autores: ["Organisation for Economic Co-operation and Development (OECD)"]
    año: 2019
    edicion_vigente: "principios 2019 con revisión 2024"
    categoria: norma
    dominios: [ia-gobernanza, etica]
    skills: [/ai]
    license: public_domain
    status: vigente
    url_oficial: "https://oecd.ai/en/ai-principles"
    idiomas: [en, es, fr, varios]
    confianza: alta
    notas: |
      5 principios de IA confiable adoptados por 47 países (mayo 2019;
      revisión 2024). Base de muchos marcos nacionales y la EU AI Act.
      Pertinente como referencia de high-level principles en gobernanza
      organizacional de IA.

  - id: unesco-ai-ethics-2021
    titulo: Recommendation on the Ethics of Artificial Intelligence
    autores: ["UNESCO"]
    año: 2021
    edicion_vigente: "Recommendation 2021"
    categoria: norma
    dominios: [ia-gobernanza, etica]
    skills: [/ai]
    license: public_domain
    status: vigente
    url_oficial: "https://www.unesco.org/en/artificial-intelligence/recommendation-ethics"
    idiomas: [en, es, fr, varios]
    confianza: alta
    notas: |
      Primer instrumento global normativo sobre ética de IA, adoptado
      por 193 Estados Miembros (noviembre 2021). Pertinente para
      contextos donde la dimensión ética/social tiene peso explícito
      (sector público, salud, educación, derechos humanos).

# ============================================================
