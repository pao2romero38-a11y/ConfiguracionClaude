ux-ui:

  - id: cooper-about-face-2014
    titulo: About Face — The Essentials of Interaction Design
    autores: ["Cooper, A.", "Reimann, R.", "Cronin, D.", "Noessel, C."]
    año: 2014
    edicion_vigente: "4th ed. (2014)"
    categoria: libro
    dominios: [ux-ui, diseño-interaccion]
    skills: [/dis]
    license: copyright
    status: vigente
    url_oficial: "https://www.wiley.com/en-us/About+Face%3A+The+Essentials+of+Interaction+Design%2C+4th+Edition-p-9781118766576"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Referencia sobre diseño de interacción. Introduce los conceptos
      de personas, escenarios y goal-directed design. Más extenso y
      sistemático que Nielsen o Norman.

  - id: ios-hig
    titulo: Apple Human Interface Guidelines (iOS / macOS / Vision Pro / watchOS)
    autores: ["Apple Inc."]
    año: 2024
    edicion_vigente: "vigente con actualizaciones por Apple en cada release de SO"
    categoria: norma
    dominios: [ux-ui]
    skills: [/dis]
    license: copyright
    status: vigente
    url_oficial: "https://developer.apple.com/design/human-interface-guidelines/"
    idiomas: [en]
    confianza: alta
    notas: |
      Guía oficial de diseño para apps en plataformas Apple. Cita
      obligatoria al diseñar para iOS/macOS. Apple actualiza con
      cada WWDC.

  - id: iso-9241-110-2020
    titulo: ISO 9241-110:2020 — Ergonomics of human-system interaction — Part 110 — Interaction principles
    autores: ["International Organization for Standardization"]
    año: 2020
    edicion_vigente: "ISO 9241-110:2020"
    categoria: norma
    dominios: [ux-ui, accesibilidad]
    skills: [/dis, /seg]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/75258.html"
    idiomas: [en]
    confianza: alta
    notas: |
      Estándar internacional de principios de interacción. Define 7
      principios: adecuación al usuario, autodescriptividad,
      conformidad con expectativas, capacidad de aprendizaje,
      controlabilidad, robustez frente a errores, satisfacción del
      usuario.

  - id: krug-dont-make-me-think-2014
    titulo: Don't Make Me Think, Revisited — A Common Sense Approach to Web and Mobile Usability
    autores: ["Krug, S."]
    año: 2014
    edicion_vigente: "3rd ed. (2014)"
    categoria: libro
    dominios: [ux-ui, usabilidad]
    skills: [/dis]
    license: copyright
    status: vigente
    url_oficial: "https://www.pearson.com/en-us/subject-catalog/p/dont-make-me-think-revisited-a-common-sense-approach-to-web-usability-3rd-edition/P200000001049"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "No me hagas pensar — actualizado"
      editor_es: "Anaya Multimedia"
    confianza: alta
    notas: |
      Lectura corta y pragmática sobre usabilidad web/mobile. Lectura
      obligatoria de iniciación. Complementa Norman con foco en
      ejecución, no teoría.

  - id: material-design-3
    titulo: Material Design 3 (Google Design System)
    autores: ["Google"]
    año: 2021
    edicion_vigente: "Material Design 3 (introducido 2021; vigente con updates)"
    categoria: norma
    dominios: [ux-ui]
    skills: [/dis]
    license: creative_commons
    status: vigente
    url_oficial: "https://m3.material.design/"
    idiomas: [en]
    confianza: alta
    notas: |
      Sistema de diseño de Google para apps en Android, web y otros
      productos. Material 3 introduce dynamic color y mayor flexibilidad
      vs Material 2. Cita obligatoria al diseñar para Android o usar
      Material Web.

  - id: nielsen-10-heuristics-1994
    titulo: 10 Usability Heuristics for User Interface Design
    autores: ["Nielsen, J."]
    año: 1994
    edicion_vigente: "1994 (refinadas 2020; vigentes)"
    categoria: norma
    dominios: [ux-ui, usabilidad]
    skills: [/dis]
    license: copyright
    status: vigente
    url_oficial: "https://www.nngroup.com/articles/ten-usability-heuristics/"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Las 10 heurísticas más citadas en evaluaciones de usabilidad:
      visibilidad del estado, match con el mundo real, control del
      usuario, consistencia, prevención de errores, reconocimiento >
      recuerdo, flexibilidad, estética minimalista, recuperación de
      errores, ayuda y documentación. Refinadas 2020.

  - id: norman-design-everyday-things-2013
    titulo: The Design of Everyday Things — Revised and Expanded Edition
    autores: ["Norman, D. A."]
    año: 2013
    edicion_vigente: "Revised & Expanded Edition (2013)"
    categoria: libro
    dominios: [ux-ui, diseño-centrado-usuario]
    skills: [/dis]
    license: copyright
    status: vigente
    url_oficial: "https://www.basicbooks.com/titles/don-norman/the-design-of-everyday-things/9780465050659/"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "El diseño de las cosas cotidianas"
      editor_es: "Nerea / Paidós (varias)"
    confianza: alta
    notas: |
      Fundación del human-centered design. Introduce signifiers,
      affordances, mapping, feedback. Lectura obligatoria de diseñador
      de cualquier nivel.

  - id: wcag-2-2-2023
    titulo: Web Content Accessibility Guidelines (WCAG) 2.2
    autores: ["W3C Web Accessibility Initiative (WAI)"]
