# ===============================================================
# CATÁLOGO CENTRAL DE FUENTES — ConfiguracionClaude/library
# ===============================================================
# Schema en library/README.md §"Schema del catálogo".
#
# Ordenar entradas alfabéticamente por id dentro de cada dominio.
# Mantener APA 7 como estándar de citación al describir cada entrada.
