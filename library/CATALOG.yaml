# ===============================================================
# CATÁLOGO CENTRAL DE FUENTES — ConfiguracionClaude/library
# ===============================================================
# Schema en library/README.md §"Schema del catálogo".
#
# Ordenar entradas alfabéticamente por id dentro de cada dominio.
# Mantener APA 7 como estándar de citación al describir cada entrada.
# ===============================================================

version: "1.0"
last_updated: "2026-05-12"
maintainer: "ConfiguracionClaude maintainers"

# ============================================================
# DOMINIO: pedagogia
# ============================================================
pedagogia:

  - id: anderson-krathwohl-2001
    titulo: A Taxonomy for Learning, Teaching, and Assessing — A Revision of Bloom's Educational Objectives
    autores: ["Anderson, L. W.", "Krathwohl, D. R."]
    año: 2001
    edicion_vigente: "1st ed. (2001) — vigente"
    categoria: libro
    dominios: [pedagogia]
    skills: [/edu]
    license: copyright
    status: vigente
    url_oficial: "https://www.pearson.com/store/p/a-taxonomy-for-learning-teaching-and-assessing/P100000814937"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Una taxonomía para la enseñanza, el aprendizaje y la evaluación"
      editor_es: "Pearson Educación (traducciones diversas; verificar edición)"
    confianza: alta
    notas: |
      Supera al Bloom 1956 original en uso académico contemporáneo. Reorganiza
      las 6 categorías cognitivas en verbos (Recordar, Comprender, Aplicar,
      Analizar, Evaluar, Crear) y añade la dimensión del tipo de conocimiento
      (factual, conceptual, procedimental, metacognitivo).

  - id: ausubel-1963
    titulo: The Psychology of Meaningful Verbal Learning
    autores: ["Ausubel, D. P."]
    año: 1963
    edicion_vigente: "1st ed. (1963)"
    categoria: libro
    dominios: [pedagogia]
    skills: [/edu]
    license: copyright
    status: vigente
    url_oficial: "" # libro descatalogado en inglés; traducciones disponibles en MX
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Psicología del aprendizaje verbal significativo"
      editor_es: "Trillas (México)"
    confianza: alta
    notas: |
      Obra fundacional del aprendizaje significativo. La teoría sigue siendo
      base operativa en el skill /edu. Para una formulación posterior con
      revisiones, ver Ausubel, Novak & Hanesian (1968, 1978, 1983).

  - id: bloom-1956
    titulo: Taxonomy of Educational Objectives — Handbook I, Cognitive Domain
    autores: ["Bloom, B. S."]
    año: 1956
    edicion_vigente: "1956 — superseded por Anderson & Krathwohl 2001"
    categoria: libro
    dominios: [pedagogia]
    skills: [/edu]
    license: copyright
    status: superseded_by:anderson-krathwohl-2001
    url_oficial: "" # libro descatalogado en su versión original
    idiomas: [en, es]
    confianza: alta
    notas: |
      Clásico fundacional del diseño curricular por objetivos. Citar como
      referencia histórica; para uso operativo en diseño instruccional
      moderno preferir Anderson & Krathwohl (2001).

  - id: booth-craft-research-2016
    titulo: The Craft of Research
    autores: ["Booth, W. C.", "Colomb, G. G.", "Williams, J. M.", "Bizup, J.", "FitzGerald, W. T."]
    año: 2016
    edicion_vigente: "4th ed. (2016)"
    categoria: libro
    dominios: [pedagogia, investigacion]
    skills: [/edu, /inv]
    license: copyright
    status: vigente
    url_oficial: "https://press.uchicago.edu/ucp/books/book/chicago/C/bo23533225.html"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "El arte de la investigación"
      editor_es: "Alianza Editorial / FCE — verificar edición disponible"
    confianza: alta
    notas: |
      Manual estándar de metodología de investigación académica. Citado
      transversalmente en los skills /edu y /inv.

  - id: cast-udl-2.2-2018
    titulo: Universal Design for Learning Guidelines (Version 2.2)
    autores: ["CAST"]
    año: 2018
    edicion_vigente: "Version 2.2 (2018) — vigente; CAST publica revisiones periódicas"
    categoria: guia
    dominios: [pedagogia, accesibilidad]
    skills: [/edu, /dis]
    license: creative_commons
    status: vigente
    url_oficial: "https://udlguidelines.cast.org"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Guía de acceso abierto. Particularmente útil cuando el diseño
      instruccional debe considerar accesibilidad y diversidad cognitiva.

  - id: gagne-conditions-1985
    titulo: The Conditions of Learning and Theory of Instruction
    autores: ["Gagné, R. M."]
    año: 1985
    edicion_vigente: "4th ed. (1985)"
    categoria: libro
    dominios: [pedagogia]
    skills: [/edu]
    license: copyright
    status: vigente
    url_oficial: ""
    idiomas: [en, es]
    confianza: alta
    notas: |
      Define los 9 eventos de instrucción de Gagné. Complementa Ausubel
      con foco en la secuencia operativa de una clase.

  - id: kirkpatrick-four-levels-2016
    titulo: Kirkpatrick's Four Levels of Training Evaluation
    autores: ["Kirkpatrick, J. D.", "Kirkpatrick, W. K."]
    año: 2016
    edicion_vigente: "1st ed. (2016)"
    categoria: libro
    dominios: [pedagogia, capacitacion-corporativa]
    skills: [/edu]
    license: copyright
    status: vigente
    url_oficial: "https://www.kirkpatrickpartners.com/the-new-world-kirkpatrick-model/"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Revisión moderna del modelo Kirkpatrick (1959) por Donald.
      Estándar industria para evaluar transferencia de capacitación
      al puesto. Los 4 niveles (Reacción, Aprendizaje, Comportamiento,
      Resultados) se citan en el skill /edu como rúbrica.

  - id: merrill-first-principles-2002
    titulo: First Principles of Instruction
    autores: ["Merrill, M. D."]
    año: 2002
    edicion_vigente: "Educational Technology Research and Development, 50(3), 43–59 (2002)"
    categoria: articulo
    dominios: [pedagogia]
    skills: [/edu]
    license: copyright
    status: vigente
    doi: "10.1007/BF02505024"
    url_oficial: "https://doi.org/10.1007/BF02505024"
    idiomas: [en]
    confianza: alta
    notas: |
      Síntesis de 5 principios universales del diseño instruccional efectivo:
      task-centered, activation, demonstration, application, integration.
      Citado transversalmente en /edu como heurística operativa.

# ============================================================
# DOMINIO: regulacion-mx
# ============================================================
regulacion-mx:

  - id: cpeum
    titulo: Constitución Política de los Estados Unidos Mexicanos
    autores: ["Congreso de la Unión (México)"]
    año: 1917
    edicion_vigente: "Texto vigente con reformas — versión más reciente publicada en DOF"
    categoria: regulacion
    dominios: [regulacion-mx]
    skills: [/ci, /aud, /seg, /rsk]
    license: public_domain
    status: vigente
    url_oficial: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPEUM.pdf"
    idiomas: [es]
    confianza: alta
    notas: |
      Texto fundamental del orden jurídico mexicano. Reformas constantes;
      verificar fecha de la última versión publicada en el sitio oficial
      de la Cámara de Diputados antes de citar.

  - id: cpf
    titulo: Código Penal Federal (México)
    autores: ["Congreso de la Unión (México)"]
    año: 1931
    edicion_vigente: "Texto vigente con reformas — versión más reciente en DOF"
    categoria: regulacion
    dominios: [regulacion-mx, penal]
    skills: [/seg, /rsk]
    license: public_domain
    status: vigente
    url_oficial: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPF.pdf"
    idiomas: [es]
    confianza: alta
    notas: |
      Norma penal federal. Para casos específicos de seguridad informática
      ver Título Noveno (Revelación de secretos y acceso ilícito a sistemas
      y equipos de informática).

  - id: dof
    titulo: Diario Oficial de la Federación
    autores: ["Gobierno de México"]
    año: "varía por publicación"
    edicion_vigente: "publicación diaria"
    categoria: gaceta
    dominios: [regulacion-mx]
    skills: [/ci, /aud, /seg, /rsk, /fin]
    license: public_domain
    status: vigente
    url_oficial: "https://www.dof.gob.mx/"
    idiomas: [es]
    confianza: alta
    notas: |
      Fuente primaria oficial de leyes, decretos, acuerdos y normas
      mexicanas. Para citar una norma específica, referenciar la
      publicación del DOF correspondiente (fecha + sección).

  - id: inai-lineamientos-datos
    titulo: Lineamientos Generales en materia de Protección de Datos Personales
    autores: ["Instituto Nacional de Transparencia, Acceso a la Información y Protección de Datos Personales (INAI)"]
    año: 2017
    edicion_vigente: "vigente con actualizaciones del INAI"
    categoria: guia
    dominios: [regulacion-mx, datos-personales]
    skills: [/seg, /ci, /aud]
    license: public_domain
    status: vigente
    url_oficial: "https://www.inai.org.mx/"
    idiomas: [es]
    confianza: alta
    notas: |
      Lineamientos publicados por INAI que operacionalizan la LFPDPPP y
      la LGPDPPSO. Para procesos de gestión de datos personales, citar
      junto con las leyes respectivas.

  - id: lfpdppp-2010
    titulo: Ley Federal de Protección de Datos Personales en Posesión de los Particulares
    autores: ["Congreso de la Unión (México)"]
    año: 2010
    edicion_vigente: "DOF 5 de julio de 2010; última reforma 27 de enero de 2017"
    categoria: regulacion
    dominios: [regulacion-mx, datos-personales]
    skills: [/seg, /ci, /aud]
    license: public_domain
    status: vigente
    url_oficial: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPDPPP.pdf"
    idiomas: [es]
    confianza: alta
    notas: |
      Ley aplicable a particulares (empresas privadas). Para sujetos
      obligados (entidades públicas) ver LGPDPPSO. Complementada por
      su Reglamento (DOF 21 de diciembre de 2011).

  - id: lgpdppso-2017
    titulo: Ley General de Protección de Datos Personales en Posesión de Sujetos Obligados
    autores: ["Congreso de la Unión (México)"]
    año: 2017
    edicion_vigente: "DOF 26 de enero de 2017"
    categoria: regulacion
    dominios: [regulacion-mx, datos-personales]
    skills: [/seg, /ci, /aud]
    license: public_domain
    status: vigente
    url_oficial: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGPDPPSO.pdf"
    idiomas: [es]
    confianza: alta
    notas: |
      Ley aplicable a entidades públicas y privadas que reciben recursos
      públicos. Complementa la LFPDPPP (que aplica al sector privado).

  - id: lgpc-2012
    titulo: Ley General de Protección Civil
    autores: ["Congreso de la Unión (México)"]
    año: 2012
    edicion_vigente: "DOF 6 de junio de 2012 con reformas"
    categoria: regulacion
    dominios: [regulacion-mx, continuidad-operativa]
    skills: [/rsk, /ci]
    license: public_domain
    status: vigente
    url_oficial: "https://www.diputados.gob.mx/LeyesBiblio/pdf/LGPC.pdf"
    idiomas: [es]
    confianza: alta
    notas: |
      Marco federal de continuidad operativa y respuesta a desastres.
      Relevante para evaluaciones de continuidad de negocio (BCP).

  - id: reglamento-lfpdppp-2011
    titulo: Reglamento de la Ley Federal de Protección de Datos Personales en Posesión de los Particulares
    autores: ["Ejecutivo Federal (México)"]
    año: 2011
    edicion_vigente: "DOF 21 de diciembre de 2011"
    categoria: regulacion
    dominios: [regulacion-mx, datos-personales]
    skills: [/seg, /ci, /aud]
    license: public_domain
    status: vigente
    url_oficial: "https://www.diputados.gob.mx/LeyesBiblio/regley/Reg_LFPDPPP.pdf"
    idiomas: [es]
    confianza: alta
    notas: |
      Reglamento operativo de la LFPDPPP. Cita obligatoria junto con la
      ley en cualquier evaluación de cumplimiento privado.

# ============================================================
# DOMINIO: finanzas
# ============================================================
finanzas:

  - id: brealey-myers-corporate-finance-2022
    titulo: Principles of Corporate Finance
    autores: ["Brealey, R. A.", "Myers, S. C.", "Allen, F.", "Edmans, A."]
    año: 2022
    edicion_vigente: "14th ed. (2022)"
    categoria: libro
    dominios: [finanzas]
    skills: [/fin, /proy]
    license: copyright
    status: vigente
    url_oficial: "https://www.mheducation.com/highered/product/principles-corporate-finance-brealey-myers/M9781265074159.html"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Principios de finanzas corporativas"
      editor_es: "McGraw-Hill (varias ediciones traducidas)"
    confianza: alta
    notas: |
      Manual estándar de finanzas corporativas. La 14ª edición incorpora
      a Edmans con foco en sustentabilidad y ESG. Para valoración pura
      preferir Damodaran. [⚠ verificar si hay edición más reciente]

  - id: cinif-marco-conceptual
    titulo: Marco Conceptual de las Normas de Información Financiera (NIF A-1 a NIF A-8)
    autores: ["Consejo Mexicano de Normas de Información Financiera (CINIF)"]
    año: 2024
    edicion_vigente: "vigente con actualizaciones anuales del CINIF"
    categoria: norma
    dominios: [finanzas, contabilidad]
    skills: [/fin, /aud, /cost]
    license: copyright
    status: vigente
    url_oficial: "https://www.cinif.org.mx/"
    idiomas: [es]
    confianza: alta
    notas: |
      Marco conceptual que sustenta todas las NIF mexicanas. Define
      postulados básicos, características cualitativas de la información
      financiera, elementos de los estados financieros y bases para
      reconocimiento y valuación.

  - id: damodaran-investment-valuation-2012
    titulo: Investment Valuation — Tools and Techniques for Determining the Value of Any Asset
    autores: ["Damodaran, A."]
    año: 2012
    edicion_vigente: "3rd ed. (2012)"
    categoria: libro
    dominios: [finanzas, valuacion]
    skills: [/fin, /proy]
    license: copyright
    status: vigente
    url_oficial: "https://www.wiley.com/en-us/Investment+Valuation%3A+Tools+and+Techniques+for+Determining+the+Value+of+Any+Asset%2C+3rd+Edition-p-9781118011522"
    idiomas: [en]
    confianza: alta
    notas: |
      Referencia universal de valuación. Damodaran mantiene un sitio
      con datos actualizados (https://pages.stern.nyu.edu/~adamodar/)
      que complementa el libro. Para casos prácticos con datos de
      mercado, consultar el sitio antes del libro.

  - id: ifrs-2024
    titulo: International Financial Reporting Standards (IFRS) — Standards and Conceptual Framework
    autores: ["International Accounting Standards Board (IASB)"]
    año: 2024
    edicion_vigente: "vigente con actualizaciones del IASB"
    categoria: norma
    dominios: [finanzas, contabilidad]
    skills: [/fin, /aud, /cost]
    license: copyright
    status: vigente
    url_oficial: "https://www.ifrs.org/issued-standards/list-of-standards/"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Normas Internacionales de Información Financiera (NIIF)"
      editor_es: "IFRS Foundation publica traducciones autorizadas en español"
    confianza: alta
    notas: |
      Estándar contable internacional usado por la mayoría de empresas
      cotizadas globalmente (excepto US GAAP en EE.UU.). Para empresas
      mexicanas con operaciones internacionales, citar IFRS junto a NIF
      indicando reconciliación cuando aplique.

  - id: nif-2024
    titulo: Normas de Información Financiera (NIF) México
    autores: ["Consejo Mexicano de Normas de Información Financiera (CINIF)"]
    año: 2024
    edicion_vigente: "edición 2024 con boletines del CINIF posteriores"
    categoria: norma
    dominios: [finanzas, contabilidad]
    skills: [/fin, /aud, /cost]
    license: copyright
    status: vigente
    url_oficial: "https://www.cinif.org.mx/"
    idiomas: [es]
    confianza: alta
    notas: |
      Estándar contable mexicano obligatorio para empresas en México.
      CINIF publica el compendio anual y boletines de actualización
      durante el año. [⚠ verificar boletines posteriores a la edición vigente]

  - id: pmbok-7-2021
    titulo: A Guide to the Project Management Body of Knowledge (PMBOK Guide)
    autores: ["Project Management Institute (PMI)"]
    año: 2021
    edicion_vigente: "7th ed. (2021)"
    categoria: norma
    dominios: [proyectos, finanzas]
    skills: [/proy, /fin]
    license: copyright
    status: vigente
    url_oficial: "https://www.pmi.org/pmbok-guide-standards/foundational/pmbok"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Guía de los Fundamentos para la Dirección de Proyectos"
      editor_es: "PMI publica edición oficial en español"
    confianza: alta
    notas: |
      La 7ª edición cambió radicalmente vs la 6ª: pasó de un enfoque
      basado en procesos (49 procesos) a uno basado en principios
      (12 principios) + dominios de desempeño. Citar 7ª como vigente;
      la 6ª solo para contextos donde la organización aún la usa.

  - id: ross-westerfield-corporate-finance-2022
    titulo: Fundamentals of Corporate Finance
    autores: ["Ross, S. A.", "Westerfield, R. W.", "Jordan, B. D."]
    año: 2022
    edicion_vigente: "13th ed. (2022)"
    categoria: libro
    dominios: [finanzas]
    skills: [/fin]
    license: copyright
    status: vigente
    url_oficial: "https://www.mheducation.com/highered/product/fundamentals-corporate-finance-ross-westerfield/M9781260772388.html"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Fundamentos de finanzas corporativas"
      editor_es: "McGraw-Hill (traducciones diversas)"
    confianza: alta
    notas: |
      Alternativa más accesible a Brealey-Myers para audiencia profesional
      que no requiere profundidad académica completa.

  - id: us-gaap-fasb-codification
    titulo: FASB Accounting Standards Codification (US GAAP)
    autores: ["Financial Accounting Standards Board (FASB)"]
    año: 2024
    edicion_vigente: "vigente con Accounting Standards Updates (ASUs)"
    categoria: norma
    dominios: [finanzas, contabilidad]
    skills: [/fin, /aud, /cost]
    license: copyright
    status: vigente
    url_oficial: "https://asc.fasb.org/"
    idiomas: [en]
    confianza: alta
    notas: |
      Estándar contable obligatorio para empresas registradas en SEC
      (EE.UU.). Para operaciones México-EE.UU. revisar reconciliación
      entre NIF/IFRS y US GAAP. Acceso a la Codificación requiere
      suscripción para uso profesional completo.

# ============================================================
# DOMINIO: seguridad-cumplimiento
# ============================================================
seguridad-cumplimiento:

  - id: cobit-2019
    titulo: COBIT 2019 Framework — Governance and Management Objectives
    autores: ["ISACA"]
    año: 2019
    edicion_vigente: "COBIT 2019 (vigente; ISACA publica updates)"
    categoria: norma
    dominios: [seguridad-cumplimiento, gobierno-ti]
    skills: [/seg, /ci, /aud, /tec]
    license: copyright
    status: vigente
    url_oficial: "https://www.isaca.org/resources/cobit"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Marco de gobernanza y gestión de TI empresarial. Complementa
      ISO/IEC 27001 (gestión de seguridad) con foco en gobierno
      corporativo de TI. Frecuentemente usado junto con ITIL 4.

  - id: coso-erm-2017
    titulo: Enterprise Risk Management — Integrating with Strategy and Performance
    autores: ["Committee of Sponsoring Organizations of the Treadway Commission (COSO)"]
    año: 2017
    edicion_vigente: "COSO ERM 2017"
    categoria: norma
    dominios: [seguridad-cumplimiento, riesgos, control-interno]
    skills: [/rsk, /ci, /aud]
    license: copyright
    status: vigente
    url_oficial: "https://www.coso.org/enterprise-risk-management"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Marco de gestión de riesgos empresariales. Reemplaza COSO ERM
      2004. Citar junto con ISO 31000:2018 al evaluar madurez de
      gestión de riesgos.

  - id: coso-ic-2013
    titulo: Internal Control — Integrated Framework
    autores: ["Committee of Sponsoring Organizations of the Treadway Commission (COSO)"]
    año: 2013
    edicion_vigente: "COSO 2013 (vigente)"
    categoria: norma
    dominios: [seguridad-cumplimiento, control-interno]
    skills: [/ci, /aud, /seg]
    license: copyright
    status: vigente
    url_oficial: "https://www.coso.org/internal-control"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Marco de control interno con 5 componentes (ambiente, evaluación
      de riesgos, actividades de control, información y comunicación,
      monitoreo) y 17 principios. Base obligatoria para evaluaciones
      SOX y auditoría interna.

  - id: gdpr-2016
    titulo: General Data Protection Regulation (Regulation EU 2016/679)
    autores: ["Parlamento Europeo y Consejo de la UE"]
    año: 2016
    edicion_vigente: "vigente desde 25 de mayo de 2018"
    categoria: regulacion
    dominios: [seguridad-cumplimiento, datos-personales]
    skills: [/seg, /ci, /aud]
    license: public_domain
    status: vigente
    url_oficial: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
    idiomas: [en, es, varios EU]
    confianza: alta
    notas: |
      Regulación europea con efecto extraterritorial. Aplica a cualquier
      empresa que trate datos de residentes en la UE, sin importar su
      sede. Citar para evaluaciones de cumplimiento de empresas con
      clientes europeos.

  - id: iso-27001-2022
    titulo: ISO/IEC 27001:2022 — Information security, cybersecurity and privacy protection — Information security management systems — Requirements
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2022
    edicion_vigente: "ISO/IEC 27001:2022 (supersede 2013)"
    categoria: norma
    dominios: [seguridad-cumplimiento]
    skills: [/seg, /ci, /aud, /rsk]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/27001"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Norma certificable para SGSI. Versión 2022 reorganiza los controles
      del Anexo A: pasa de 114 controles en 14 dominios (2013) a 93
      controles en 4 temas (Organizacional, Personas, Físico,
      Tecnológico). Período de transición 2022-2025; verificar status
      de certificaciones vigentes.

  - id: iso-27002-2022
    titulo: ISO/IEC 27002:2022 — Information security, cybersecurity and privacy protection — Information security controls
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2022
    edicion_vigente: "ISO/IEC 27002:2022"
    categoria: norma
    dominios: [seguridad-cumplimiento]
    skills: [/seg, /ci, /aud]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/75652.html"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Norma de guía complementaria a 27001 (NO certificable). Catálogo
      de 93 controles con guía de implementación. Citar junto con 27001
      al describir un control específico.

  - id: iso-27005-2022
    titulo: ISO/IEC 27005:2022 — Information security risk management
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2022
    edicion_vigente: "ISO/IEC 27005:2022"
    categoria: norma
    dominios: [seguridad-cumplimiento, riesgos]
    skills: [/seg, /rsk]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/80585.html"
    idiomas: [en]
    confianza: alta
    notas: |
      Guía operativa para gestión de riesgos de seguridad de la
      información. Complementa 27001 (que exige gestión de riesgos pero
      no la detalla) con 31000 (marco general de riesgos).

  - id: iso-31000-2018
    titulo: ISO 31000:2018 — Risk management — Guidelines
    autores: ["International Organization for Standardization"]
    año: 2018
    edicion_vigente: "ISO 31000:2018"
    categoria: norma
    dominios: [seguridad-cumplimiento, riesgos]
    skills: [/rsk, /ci, /aud]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/65694.html"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Marco general de gestión de riesgos aplicable a cualquier dominio.
      No es certificable (es guía). Base para 27005 (seguridad) y
      complementa COSO ERM en evaluaciones empresariales.

  - id: itil-4-2019
    titulo: ITIL 4 Foundation (and core publications)
    autores: ["AXELOS (PeopleCert)"]
    año: 2019
    edicion_vigente: "ITIL 4 (vigente; supersede ITIL v3 2011)"
    categoria: norma
    dominios: [seguridad-cumplimiento, gobierno-ti]
    skills: [/seg, /tec, /ci]
    license: copyright
    status: vigente
    url_oficial: "https://www.axelos.com/best-practice-solutions/itil"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Marco de gestión de servicios de TI. Versión 4 (2019) supersede
      ITIL v3 con cambios estructurales: 4 dimensiones, sistema de
      valor de servicio (SVS), 34 prácticas (vs 26 procesos de v3).
      Para nuevas implementaciones: ITIL 4. Para mantenimiento de v3
      existente: verificar fecha de soporte de AXELOS.

  - id: nist-csf-2-2024
    titulo: NIST Cybersecurity Framework 2.0
    autores: ["National Institute of Standards and Technology"]
    año: 2024
    edicion_vigente: "CSF 2.0 (publicado 26 de febrero de 2024)"
    categoria: norma
    dominios: [seguridad-cumplimiento]
    skills: [/seg, /rsk, /ci]
    license: public_domain
    status: vigente
    doi: "10.6028/NIST.CSWP.29"
    url_oficial: "https://www.nist.gov/cyberframework"
    idiomas: [en]
    confianza: alta
    notas: |
      Marco voluntario pero ampliamente adoptado para gestión de
      ciberseguridad. La versión 2.0 añade la función GOVERN (gobierno)
      a las 5 originales (Identify, Protect, Detect, Respond, Recover)
      → ahora 6 funciones. Frecuente en evaluaciones de madurez.

  - id: nist-sp-800-30r1
    titulo: NIST SP 800-30 Rev. 1 — Guide for Conducting Risk Assessments
    autores: ["National Institute of Standards and Technology"]
    año: 2012
    edicion_vigente: "Rev. 1 (2012) — sigue vigente"
    categoria: norma
    dominios: [seguridad-cumplimiento, riesgos]
    skills: [/seg, /rsk]
    license: public_domain
    status: vigente
    url_oficial: "https://csrc.nist.gov/pubs/sp/800/30/r1/final"
    idiomas: [en]
    confianza: alta
    notas: |
      Guía operativa para evaluaciones de riesgo en federales/contratistas
      US. Complementa SP 800-39 (Risk Management) y 800-37 (Risk
      Management Framework). Útil como template incluso fuera del
      contexto US federal.

  - id: nist-sp-800-53r5
    titulo: NIST SP 800-53 Rev. 5 — Security and Privacy Controls for Information Systems and Organizations
    autores: ["National Institute of Standards and Technology"]
    año: 2020
    edicion_vigente: "Rev. 5 (septiembre 2020) con actualizaciones"
    categoria: norma
    dominios: [seguridad-cumplimiento]
    skills: [/seg, /ci, /aud]
    license: public_domain
    status: vigente
    url_oficial: "https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final"
    idiomas: [en]
    confianza: alta
    notas: |
      Catálogo de 1000+ controles de seguridad y privacidad. Obligatorio
      para sistemas federales US y de contratistas. Frecuentemente usado
      como referencia detallada que complementa NIST CSF (más abstracto).

  - id: pci-dss-4-2022
    titulo: Payment Card Industry Data Security Standard (PCI DSS) v4.0
    autores: ["PCI Security Standards Council"]
    año: 2022
    edicion_vigente: "v4.0 (marzo 2022) — vigente; v3.2.1 retirado en marzo 2024"
    categoria: norma
    dominios: [seguridad-cumplimiento, datos-tarjetas]
    skills: [/seg, /ci, /aud]
    license: copyright
    status: vigente
    url_oficial: "https://www.pcisecuritystandards.org/document_library/"
    idiomas: [en]
    confianza: alta
    notas: |
      Norma obligatoria para cualquier organización que procesa, almacena
      o transmite datos de tarjetas de crédito. v4.0 supersede v3.2.1
      con cambios sustantivos en autenticación, scripts de pago,
      objetivos personalizados.

# ============================================================
# DOMINIO: auditoria
# ============================================================
auditoria:

  - id: aicpa-code-of-conduct-2024
    titulo: AICPA Code of Professional Conduct
    autores: ["American Institute of Certified Public Accountants (AICPA)"]
    año: 2024
    edicion_vigente: "vigente con interpretaciones publicadas"
    categoria: norma
    dominios: [auditoria, etica-profesional]
    skills: [/aud]
    license: copyright
    status: vigente
    url_oficial: "https://us.aicpa.org/research/standards/codeofconduct"
    idiomas: [en]
    confianza: alta
    notas: |
      Código de conducta profesional para CPAs estadounidenses.
      Referencia para evaluaciones de independencia y ética en
      auditoría con componente US.

  - id: ifac-handbook-2024
    titulo: Handbook of International Quality Management, Auditing, Review, Other Assurance, and Related Services Pronouncements
    autores: ["International Federation of Accountants (IFAC) / IAASB"]
    año: 2024
    edicion_vigente: "2024 edition — vigente"
    categoria: norma
    dominios: [auditoria]
    skills: [/aud]
    license: copyright
    status: vigente
    url_oficial: "https://www.ifac.org/_flysystem/azure-private/publications/files/IAASB-2024-Handbook-Volume-1.pdf"
    idiomas: [en]
    confianza: alta
    notas: |
      Compendio oficial anual del IAASB. Incluye todas las ISA
      vigentes, ISQM (calidad), ISRE (revisión), ISAE (otros encargos
      de aseguramiento). Referencia comprehensiva para auditoría externa.

  - id: iia-ippf-2017
    titulo: International Professional Practices Framework (IPPF)
    autores: ["The Institute of Internal Auditors (IIA)"]
    año: 2017
    edicion_vigente: "vigente hasta enero 2025; supersedido por Global Internal Audit Standards (2024)"
    categoria: norma
    dominios: [auditoria]
    skills: [/aud, /ci]
    license: copyright
    status: superseded_by:iia-standards-2024
    url_oficial: "https://www.theiia.org/en/standards/"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Marco profesional anterior de auditoría interna. Reemplazado por
      Global Internal Audit Standards 2024 efectivo 9 de enero de 2025.
      Citar IPPF solo para período pre-2025 o contextos de transición.

  - id: iia-standards-2024
    titulo: Global Internal Audit Standards
    autores: ["The Institute of Internal Auditors (IIA)"]
    año: 2024
    edicion_vigente: "Global Internal Audit Standards (efectivos 9 de enero de 2025)"
    categoria: norma
    dominios: [auditoria]
    skills: [/aud, /ci]
    license: copyright
    status: vigente
    url_oficial: "https://www.theiia.org/en/standards/2024-standards/global-internal-audit-standards/"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Normas Globales de Auditoría Interna"
      editor_es: "IIA publica versión oficial en español"
    confianza: alta
    notas: |
      Estándar global vigente para auditoría interna. Supersede el IPPF.
      15 principios organizados en 5 dominios. Adopción obligatoria
      para certificados CIA y miembros del IIA.

  - id: isa-iaasb-2024
    titulo: International Standards on Auditing (ISA)
    autores: ["International Auditing and Assurance Standards Board (IAASB)"]
    año: 2024
    edicion_vigente: "ISA actualizadas en Handbook IFAC 2024"
    categoria: norma
    dominios: [auditoria]
    skills: [/aud]
    license: copyright
    status: vigente
    url_oficial: "https://www.iaasb.org/standards-pronouncements"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Normas Internacionales de Auditoría (NIA)"
      editor_es: "IFAC publica traducción oficial al español"
    confianza: alta
    notas: |
      Estándares de auditoría externa de aplicación internacional.
      Para auditoría en México son las NIA (Normas Internacionales
      de Auditoría adoptadas por el IMCP). Citar ISA específica
      relevante (ej. ISA 315, ISA 240) en hallazgos de auditoría.

  - id: issai-intosai-2022
    titulo: International Standards of Supreme Audit Institutions (ISSAI)
    autores: ["International Organization of Supreme Audit Institutions (INTOSAI)"]
    año: 2022
    edicion_vigente: "Framework ISSAI vigente con actualizaciones de INTOSAI"
    categoria: norma
    dominios: [auditoria, sector-publico]
    skills: [/aud]
    license: public_domain
    status: vigente
    url_oficial: "https://www.issai.org/"
    idiomas: [en, es, varios]
    confianza: alta
    notas: |
      Estándares para auditoría gubernamental / sector público.
      En México aplicables a Auditoría Superior de la Federación
      (ASF). Para auditorías mixtas privadas/públicas, citar junto
      con ISA.

# ============================================================
# DOMINIO: ia-gobernanza
# ============================================================
ia-gobernanza:

  - id: eu-ai-act-2024
    titulo: Regulation (EU) 2024/1689 (Artificial Intelligence Act)
    autores: ["Parlamento Europeo y Consejo de la UE"]
    año: 2024
    edicion_vigente: "Reglamento UE 2024/1689 (en vigor desde 1 de agosto de 2024; aplicación escalonada)"
    categoria: regulacion
    dominios: [ia-gobernanza]
    skills: [/ai, /seg, /rsk, /ci]
    license: public_domain
    status: vigente
    url_oficial: "https://eur-lex.europa.eu/eli/reg/2024/1689/oj"
    idiomas: [en, es, varios EU]
    confianza: alta
    notas: |
      Primer marco regulatorio comprehensivo de IA con alcance
      extraterritorial. Clasifica sistemas por nivel de riesgo
      (prohibido, alto, limitado, mínimo). Aplicación escalonada:
      prohibiciones desde feb 2025, gobernanza de modelos generales
      desde ago 2025, alto riesgo desde ago 2026.

  - id: iso-23894-2023
    titulo: ISO/IEC 23894:2023 — Information technology — Artificial intelligence — Guidance on risk management
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2023
    edicion_vigente: "ISO/IEC 23894:2023"
    categoria: norma
    dominios: [ia-gobernanza, riesgos]
    skills: [/ai, /rsk]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/77304.html"
    idiomas: [en]
    confianza: alta
    notas: |
      Guía de gestión de riesgos específica para IA. Extiende ISO 31000
      con criterios IA: explicabilidad, sesgos, seguridad de modelos,
      privacidad en aprendizaje. Complementa ISO/IEC 42001.

  - id: iso-42001-2023
    titulo: ISO/IEC 42001:2023 — Information technology — Artificial intelligence — Management system
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2023
    edicion_vigente: "ISO/IEC 42001:2023"
    categoria: norma
    dominios: [ia-gobernanza]
    skills: [/ai, /seg, /ci]
    license: copyright
    status: vigente
    url_oficial: "https://www.iso.org/standard/81230.html"
    idiomas: [en]
    confianza: alta
    notas: |
      Primera norma ISO certificable para sistemas de gestión de IA
      (AIMS). Análoga a ISO 27001 pero para gobernanza de IA. Aplica
      a organizaciones que desarrollan o usan sistemas de IA.

  - id: nist-ai-rmf-1-2023
    titulo: NIST AI Risk Management Framework (AI RMF 1.0)
    autores: ["National Institute of Standards and Technology"]
    año: 2023
    edicion_vigente: "AI RMF 1.0 (enero 2023)"
    categoria: norma
    dominios: [ia-gobernanza, riesgos]
    skills: [/ai, /rsk, /seg]
    license: public_domain
    status: vigente
    doi: "10.6028/NIST.AI.100-1"
    url_oficial: "https://www.nist.gov/itl/ai-risk-management-framework"
    idiomas: [en]
    confianza: alta
    notas: |
      Marco voluntario de gestión de riesgos de IA. 4 funciones core:
      Govern, Map, Measure, Manage. Generic AI Profile y otros perfiles
      sectoriales (GenAI Profile publicado julio 2024). Frecuentemente
      citado como referencia técnica.

  - id: oecd-ai-principles-2024
    titulo: OECD Principles on Artificial Intelligence
    autores: ["Organisation for Economic Co-operation and Development (OECD)"]
    año: 2019
    edicion_vigente: "principios 2019 con revisión 2024"
    categoria: norma
    dominios: [ia-gobernanza, etica]
    skills: [/ai]
    license: public_domain
    status: vigente
    url_oficial: "https://oecd.ai/en/ai-principles"
    idiomas: [en, es, fr, varios]
    confianza: alta
    notas: |
      5 principios de IA confiable adoptados por 47 países (mayo 2019;
      revisión 2024). Base de muchos marcos nacionales y la EU AI Act.
      Pertinente como referencia de high-level principles en gobernanza
      organizacional de IA.

  - id: unesco-ai-ethics-2021
    titulo: Recommendation on the Ethics of Artificial Intelligence
    autores: ["UNESCO"]
    año: 2021
    edicion_vigente: "Recommendation 2021"
    categoria: norma
    dominios: [ia-gobernanza, etica]
    skills: [/ai]
    license: public_domain
    status: vigente
    url_oficial: "https://www.unesco.org/en/artificial-intelligence/recommendation-ethics"
    idiomas: [en, es, fr, varios]
    confianza: alta
    notas: |
      Primer instrumento global normativo sobre ética de IA, adoptado
      por 193 Estados Miembros (noviembre 2021). Pertinente para
      contextos donde la dimensión ética/social tiene peso explícito
      (sector público, salud, educación, derechos humanos).
