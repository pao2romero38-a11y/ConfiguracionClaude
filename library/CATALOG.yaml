    notas: |
      Trabajo fundacional sobre valor de marca (brand equity). Aaker
      define las 5 dimensiones: conciencia, calidad percibida,
      lealtad, asociaciones, otros activos. Base de la mayoría de
      modelos posteriores de valoración de marcas.

  - id: ama-definition-marketing-2017
    titulo: AMA Definition of Marketing
    autores: ["American Marketing Association"]
    año: 2017
    edicion_vigente: "Definición aprobada por AMA en 2017"
    categoria: norma
    dominios: [marketing]
    skills: [/mkt]
    license: copyright
    status: vigente
    url_oficial: "https://www.ama.org/the-definition-of-marketing-what-is-marketing/"
    idiomas: [en]
    confianza: alta
    notas: |
      Definición oficial de marketing por la AMA: "Actividad, conjunto
      de instituciones y procesos para crear, comunicar, entregar e
      intercambiar ofertas que tienen valor para clientes, socios y la
      sociedad en general." Útil cuando se requiere terminología
      profesional alineada con consenso del campo.

  - id: christensen-innovators-dilemma-1997
    titulo: The Innovator's Dilemma — When New Technologies Cause Great Firms to Fail
    autores: ["Christensen, C. M."]
    año: 1997
    edicion_vigente: "1997 (vigente como base teórica)"
    categoria: libro
    dominios: [marketing, estrategia]
    skills: [/mkt, /proy, /tec]
    license: copyright
    status: vigente
    url_oficial: "https://www.harvardbusiness.org/the-innovators-dilemma-when-new-technologies-cause-great-firms-to-fail/"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "El dilema del innovador"
      editor_es: "Granica"
    confianza: alta
    notas: |
      Teoría de disrupción tecnológica. Referencia obligatoria al
      analizar entrada de competidores con propuestas de menor costo
      en mercados consolidados.

  - id: godin-permission-marketing-1999
    titulo: Permission Marketing — Turning Strangers into Friends and Friends into Customers
    autores: ["Godin, S."]
    año: 1999
    edicion_vigente: "1999 (concepto vigente; marketing digital lo adoptó como base)"
    categoria: libro
    dominios: [marketing, marketing-digital]
    skills: [/mkt]
    license: copyright
    status: vigente
    url_oficial: "https://www.simonandschuster.com/books/Permission-Marketing/Seth-Godin/9780684856360"
    idiomas: [en, es]
    confianza: alta
    notas: |
      Establece el paradigma de marketing basado en consentimiento del
      usuario en lugar de interrupción. Base conceptual del inbound
      marketing, email marketing opt-in y content marketing.

  - id: kahneman-thinking-2011
    titulo: Thinking, Fast and Slow
    autores: ["Kahneman, D."]
    año: 2011
    edicion_vigente: "2011 (referencia central de marketing conductual)"
    categoria: libro
    dominios: [marketing, comportamiento-consumidor, behavioral-economics]
    skills: [/mkt, /fin, /edu]
    license: copyright
    status: vigente
    url_oficial: "https://www.fsgbooks.com/9780374533557/thinking-fast-and-slow/"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Pensar rápido, pensar despacio"
      editor_es: "Debate (Penguin Random House)"
    confianza: alta
    notas: |
      Síntesis de 4 décadas de investigación en heurísticas y sesgos
      cognitivos. Aplicable transversalmente al diseño de propuestas
      de valor, pricing, decisiones financieras del consumidor.

  - id: kotler-keller-marketing-management-2022
    titulo: Marketing Management
    autores: ["Kotler, P.", "Keller, K. L.", "Chernev, A."]
    año: 2022
    edicion_vigente: "16th ed. (2022)"
    categoria: libro
    dominios: [marketing]
    skills: [/mkt]
    license: copyright
    status: vigente
    url_oficial: "https://www.pearson.com/en-us/subject-catalog/p/marketing-management/P200000005942"
    idiomas: [en, es]
    traduccion_es:
      titulo_es: "Dirección de Marketing"
      editor_es: "Pearson Educación"
    confianza: alta
    notas: |
      Manual estándar mundial de marketing management. La 16ª edición
      añade énfasis en marketing digital y métricas de performance.
      [⚠ verificar si hay 17ª edición publicada]

  - id: porter-competitive-strategy-1980
    titulo: Competitive Strategy — Techniques for Analyzing Industries and Competitors
