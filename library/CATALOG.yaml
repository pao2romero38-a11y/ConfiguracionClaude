      Texto fundamental del orden jurídico mexicano. Reformas constantes;
      verificar fecha de la última versión publicada en el sitio oficial
      de la Cámara de Diputados antes de citar.

  - id: cpf
    titulo: Código Penal Federal (México)
    autores: ["Congreso de la Unión (México)"]
    año: 1931
    edicion_vigente: "Texto vigente con reformas — versión más reciente en DOF"
    categoria: regulacion
    dominios: [regulacion-mx, penal]
    skills: [/seg, /rsk]
    license: public_domain
    status: vigente
    url_oficial: "https://www.diputados.gob.mx/LeyesBiblio/pdf/CPF.pdf"
    idiomas: [es]
    confianza: alta
    notas: |
      Norma penal federal. Para casos específicos de seguridad informática
      ver Título Noveno (Revelación de secretos y acceso ilícito a sistemas
      y equipos de informática).

  - id: dof
    titulo: Diario Oficial de la Federación
    autores: ["Gobierno de México"]
    año: "varía por publicación"
    edicion_vigente: "publicación diaria"
    categoria: gaceta
    dominios: [regulacion-mx]
    skills: [/ci, /aud, /seg, /rsk, /fin]
    license: public_domain
    status: vigente
    url_oficial: "https://www.dof.gob.mx/"
