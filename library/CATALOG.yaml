      de 93 controles con guía de implementación. Citar junto con 27001
      al describir un control específico.

  - id: iso-27005-2022
    titulo: ISO/IEC 27005:2022 — Information security risk management
    autores: ["International Organization for Standardization", "International Electrotechnical Commission"]
    año: 2022
    edicion_vigente: "ISO/IEC 27005:2022"
    categoria: norma
    dominios: [seguridad-cumplimiento, riesgos]
    skills: [/seg, /rsk]
